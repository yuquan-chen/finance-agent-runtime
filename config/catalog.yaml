version: "2026-07-24"
description: "Legacy/test catalog. Runtime table schema is sourced from the Python TableRegistry; this file provides business terms and compatibility fixtures."
tables:
  - name: card_transaction
    description: "Card transaction ledger. Stores card-related transfers, purchases, refunds, fees, and reversals."
    primary_key: id
    allowed_intents:
      - latest_by_group
      - top_n
      - count_distinct
      - aggregate_by_group
    columns:
      - name: id
        type: uuid
        semantic: "Transaction primary key."
        sensitive: false
      - name: id_no
        type: bigint
        semantic: "Monotonic transaction sequence used as a fallback ordering field."
        sensitive: false
      - name: account_id
        type: uuid
        semantic: "Customer account identifier. Used as customer_id in card transaction analysis."
        sensitive: false
      - name: card_id
        type: uuid
        semantic: "Card identifier."
        sensitive: false
      - name: card_channel
        type: text
        semantic: "Card issuing or processing channel."
        sensitive: false
      - name: type
        type: text
        semantic: "Transaction type. Examples: consumption, transfer_in, transfer_out, refund, reversal."
        sensitive: false
      - name: status
        type: text
        semantic: "Transaction status. Completed/success-like values are used for settled consumption analytics."
        sensitive: false
      - name: total_amount
        type: decimal
        semantic: "Total transaction amount."
        sensitive: false
      - name: settle_amount
        type: decimal
        semantic: "Settled amount."
        sensitive: false
      - name: origin_amount
        type: decimal
        semantic: "Original transaction amount."
        sensitive: false
      - name: currency
        type: text
        semantic: "Transaction currency."
        sensitive: false
      - name: transaction_at
        type: timestamptz
        semantic: "Business transaction timestamp. Preferred ordering field for latest transaction queries."
        sensitive: false
      - name: complete_at
        type: timestamptz
        semantic: "Completion timestamp."
        sensitive: false
      - name: channel_complete_at
        type: timestamptz
        semantic: "Channel completion timestamp."
        sensitive: false
      - name: created_at
        type: timestamptz
        semantic: "Record creation timestamp."
        sensitive: false
    relationships: []
business_terms:
  kyc_status:
    description: "客户 KYC/KYB 状态查询，第一版以账户表中的状态字段为主。"
    aliases: ["KYC", "KYB", "kyc", "kyb", "身份认证", "身份验证", "合规状态"]
    candidate_tables: ["account"]
  payment:
    description: "支付或收款交易，优先使用支付交易表。"
    aliases: ["支付", "收款", "payment"]
    candidate_tables: ["pay_transaction"]
  payout:
    description: "付款、打款或汇款交易，优先使用付款交易表。"
    aliases: ["付款", "打款", "汇款", "payout"]
    candidate_tables: ["payout_transaction"]
  transaction_status:
    description: "卡交易状态分布，使用卡交易表的状态字段。"
    aliases: ["交易状态", "状态分布", "status distribution"]
    candidate_tables: ["card_transaction"]
  customer:
    description: "Customer identity is resolved through the account name fields; transaction account identifiers remain available as join fields."
    aliases: ["客户", "公司", "企业", "company"]
    candidate_tables: ["account", "card_transaction", "payout_transaction", "pay_transaction"]
  card_channel:
    description: "Card channel dimension."
    aliases: ["卡渠道", "渠道", "channel"]
    candidate_tables: ["card_transaction", "card_channel"]
  consumption:
    description: "Consumption transaction. Prefer type = consumption and completed/success-like statuses."
    aliases: ["消费", "购买", "purchase"]
    filters:
      - field: card_transaction.type
        op: in
        value: ["consumption", "consume", "purchase"]
      - field: card_transaction.status
        op: in
        value: ["completed", "success", "succeeded", "settled"]
