version: "2026-07-24"
max_rows: 1000
statement_timeout_ms: 30000
default_limit: 50
planner_max_retries: 2
sensitive_column_patterns:
  - "password"
  - "secret"
  - "token"
  - "api_key"
  - "id_card"
  - "passport"
  - "ssn"
  - "salary"
  - "bank_account"
  - "phone"
  - "email"
forbidden_sql_keywords:
  # DDL/DML 操作
  - insert
  - update
  - delete
  - drop
  - alter
  - truncate
  - create
  - grant
  - revoke
  - merge
  - call
  # PostgreSQL 危险函数
  - pg_read_file
  - pg_write_file
  - pg_read_binary_file
  - lo_import
  - lo_export
  - lo_unlink
  - copy
  # 系统信息访问
  - pg_stat_activity
  - pg_stat_replication
  - pg_stat_wal_receiver
  - pg_stat_ssl
  - pg_stat_progress
  - pg_backend_pid
  - pg_postmaster_start_time
  - pg_conf_load_time
  # 文件系统操作
  - pg_ls_dir
  - pg_stat_file
  - pg_relation_filenode
  - pg_relation_filepath
  # 网络/DoS
  - pg_sleep
  - pg_sleep_for
  - pg_sleep_until
  # 其他危险
  - dblink
  - dblink_exec
  - dblink_connect
  - dblink_open
  - dblink_fetch
  - dblink_close
  - dblink_disconnect
approval:
  auto_execute_intents:
    - latest_by_group
    - top_n
    - count_distinct
    - aggregate_by_group
  require_approval_for_opencode: true
