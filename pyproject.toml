[project]
name = "finance-agent-runtime"
version = "0.1.0"
description = "Governed multi-turn analysis agent for sensitive data with LangGraph, OpenAI-compatible LLMs, and deterministic guards."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "langgraph>=0.2",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
observability = [
  "langsmith>=0.2",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"finance_agent.api" = ["static/*.html"]
