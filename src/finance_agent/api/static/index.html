<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Agent</title>
  <style>
    :root { --bg:#fbfbfa; --panel:#ffffff; --panel-muted:#f8f8f7; --ink:#20201f; --muted:#777774; --line:#e8e8e5; --subtle:#f4f4f1; --accent:#131311; --brand:rgb(100,191,4); --brand-strong:#4c9301; --brand-ink:#315f02; --brand-soft:rgba(100,191,4,.13); --focus:rgba(100,191,4,.24); --danger:#c53d31; --sidebar-width:248px; --inspector-width:348px; }
    body.theme-dark { --bg:#161715; --panel:#1d1e1b; --panel-muted:#1a1b19; --ink:#f0f1ed; --muted:#a9aaa4; --line:#32342f; --subtle:#272925; --accent:#eff1ec; --brand:#8ee038; --brand-strong:#a3ea59; --brand-ink:#b8f579; --brand-soft:rgba(142,224,56,.16); --focus:rgba(142,224,56,.28); --danger:#ff8e83; color-scheme:dark; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; }
    body { min-width:1024px; color:var(--ink); background:var(--bg); font:14px/1.55 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, textarea { font:inherit; }
    button { cursor:pointer; }
    .app { display:grid; grid-template-columns:var(--sidebar-width) 7px minmax(540px, 1fr) 7px var(--inspector-width); height:100vh; height:100dvh; min-height:0; overflow:hidden; }
    .sidebar { display:flex; flex-direction:column; min-width:0; background:var(--panel-muted); padding:15px 11px 12px; }
    .panel-resizer { position:relative; z-index:3; width:7px; cursor:col-resize; background:transparent; touch-action:none; }
    .panel-resizer::after { position:absolute; top:0; bottom:0; left:3px; width:1px; background:var(--line); content:""; transition:background .15s, box-shadow .15s; }
    .panel-resizer:hover::after, .panel-resizer.dragging::after { background:var(--brand); box-shadow:0 0 0 1px var(--brand-soft); }
    .panel-resizer:focus-visible { outline:0; }
    .panel-resizer:focus-visible::after { background:var(--brand); box-shadow:0 0 0 3px var(--focus); }
    body.is-resizing { cursor:col-resize; user-select:none; }
    .brand-row { display:flex; align-items:center; justify-content:space-between; padding:3px 7px 15px; }
    .brand { display:flex; align-items:center; gap:8px; font-size:16px; font-weight:650; letter-spacing:-.02em; }
    .brand-mark { display:grid; place-items:center; width:23px; height:23px; color:#102000; background:var(--brand); border-radius:7px; font-size:12px; }
    .icon-button { display:grid; place-items:center; width:30px; height:30px; border:0; border-radius:7px; color:var(--muted); background:transparent; font-size:18px; }
    .icon-button:hover { background:var(--subtle); color:var(--ink); }
    .new-chat { display:flex; align-items:center; gap:9px; width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:9px; color:var(--ink); background:var(--panel); text-align:left; font-weight:550; box-shadow:0 1px 1px rgba(0,0,0,.02); }
    .new-chat:hover { background:var(--subtle); border-color:var(--brand); }
    .new-chat .plus { font-size:20px; font-weight:300; line-height:12px; }
    .side-section { margin-top:25px; }
    .side-label { display:flex; justify-content:space-between; align-items:center; padding:0 8px 7px; color:#92928e; font-size:11px; font-weight:650; letter-spacing:.04em; text-transform:uppercase; }
    .session-list { display:flex; flex-direction:column; gap:2px; overflow:auto; max-height:calc(100vh - 210px); }
    .session { display:flex; align-items:center; gap:9px; width:100%; min-width:0; padding:8px 8px; border:0; border-radius:7px; color:#555552; background:transparent; text-align:left; cursor:pointer; }
    .session:hover { background:var(--subtle); color:var(--ink); }
    .session.active { color:var(--ink); background:var(--brand-soft); font-weight:560; }
    .session-icon { flex:0 0 auto; color:#858581; font-size:14px; }
    .session-title { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .session-actions { display:flex; align-items:center; gap:1px; margin-left:auto; opacity:0; transition:opacity .16s; }
    .session:hover .session-actions, .session:focus-within .session-actions { opacity:1; }
    .session-action { display:grid; place-items:center; width:23px; height:23px; padding:0; border:0; border-radius:6px; color:var(--muted); background:transparent; font-size:13px; }
    .session-action:hover { color:var(--ink); background:var(--panel); }
    .session-action.pin-active { color:var(--brand-ink); background:var(--brand-soft); }
    .session-action.delete:hover { color:var(--danger); }
    .empty-sessions { padding:9px 8px; color:#999995; font-size:12px; }
    .sidebar-footer { margin-top:auto; padding:12px 4px 0; border-top:1px solid var(--line); }
    .footer-row { display:flex; align-items:center; gap:8px; padding:8px 5px; color:#71716e; font-size:12px; }
    .footer-dot { width:7px; height:7px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
    .workspace { display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--panel); }
    .topbar { display:flex; align-items:center; min-height:52px; padding:0 20px; border-bottom:1px solid var(--line); }
    .conversation-title { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:14px; font-weight:580; }
    .topbar-actions { display:flex; align-items:center; gap:3px; margin-left:auto; }
    .topbar-actions .icon-button { width:32px; height:32px; font-size:16px; }
    .conversation { flex:1 1 auto; min-height:0; overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain; scroll-behavior:smooth; scrollbar-gutter:stable; }
    .messages { width:min(810px, calc(100% - 56px)); margin:0 auto; padding:42px 0 24px; }
    .welcome { display:flex; flex-direction:column; align-items:flex-start; justify-content:center; min-height:calc(100vh - 230px); padding:0 9%; }
    .welcome-mark { display:grid; place-items:center; width:39px; height:39px; margin-bottom:19px; border-radius:11px; color:#102000; background:var(--brand); font-weight:700; }
    .welcome h1 { margin:0; font-size:27px; line-height:1.25; letter-spacing:-.04em; }
    .welcome p { max-width:510px; margin:10px 0 22px; color:var(--muted); font-size:15px; }
    .suggestions { display:flex; flex-wrap:wrap; gap:8px; }
    .suggestion { padding:7px 11px; border:1px solid var(--line); border-radius:18px; color:var(--muted); background:var(--panel); font-size:12px; }
    .suggestion:hover { border-color:var(--brand); color:var(--brand-ink); background:var(--brand-soft); }
    .msg { display:flex; gap:12px; margin-bottom:37px; }
    .msg-avatar { display:grid; place-items:center; flex:0 0 auto; width:27px; height:27px; margin-top:1px; border-radius:8px; color:#102000; background:var(--brand); font-size:11px; font-weight:700; }
    .msg.user { justify-content:flex-end; }
    .msg.user .msg-avatar { display:none; }
    .msg-content { min-width:0; max-width:calc(100% - 39px); color:var(--ink); white-space:pre-wrap; word-break:break-word; }
    .msg.user .msg-content { max-width:75%; padding:9px 13px; border-radius:16px 16px 4px 16px; background:var(--brand-soft); }
    .msg-content { position:relative; }
    .msg.bot .msg-content { padding:2px 0; font-size:14px; line-height:1.72; white-space:normal; }
    .message-tools { position:absolute; top:calc(100% + 4px); left:0; display:flex; align-items:center; gap:2px; opacity:0; transition:opacity .15s; }
    .msg.user .message-tools { right:0; left:auto; }
    .msg-content:hover .message-tools, .msg-content:focus-within .message-tools, .message-tools.copied { opacity:1; }
    .message-tool { display:grid; place-items:center; width:26px; height:24px; padding:0; border:1px solid transparent; border-radius:6px; color:var(--muted); background:transparent; font-size:14px; transition:color .15s, background .15s, border-color .15s; }
    .message-tool:hover { border-color:var(--line); color:var(--ink); background:var(--subtle); }
    .message-tool:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    .msg-content h1, .msg-content h2, .msg-content h3 { margin:10px 0 5px; color:var(--ink); line-height:1.35; letter-spacing:-.02em; }
    .msg-content h1 { font-size:19px; } .msg-content h2 { font-size:17px; } .msg-content h3 { font-size:15px; }
    .msg-content p { margin:0 0 10px; } .msg-content ul { margin:4px 0 10px; padding-left:21px; } .msg-content li { margin:2px 0; }
    .msg-content strong { font-weight:680; }
    .msg-content pre { overflow:auto; margin:12px 0; padding:14px; border:1px solid #e5e5e1; border-radius:9px; color:#343430; background:#f7f7f5; font:12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
    .msg-content code { padding:1px 4px; border-radius:4px; background:#f0f0ed; font:12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .table-wrapper { overflow:auto; margin:14px 0 8px; border:1px solid #e3e3df; border-radius:9px; }
    .msg-content table { width:100%; min-width:560px; border-collapse:collapse; font-size:12px; }
    .msg-content th, .msg-content td { padding:8px 10px; border-bottom:1px solid #ededeb; text-align:left; white-space:nowrap; }
    .msg-content th { color:#676763; background:#f7f7f5; font-size:11px; font-weight:650; }
    .msg-content tr:last-child td { border-bottom:0; }
    .msg-content td.num { text-align:right; font-variant-numeric:tabular-nums; }
    .note { margin-top:7px; color:#858582; font-size:12px; }
    .sandbox { margin-top:13px; padding:9px 11px; border:1px solid #dbe9df; border-radius:8px; color:#38704a; background:#f4faf5; font-size:12px; }
    .review-card { margin:15px 0 3px; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:0 8px 24px rgba(24,30,19,.06); }
    .review-card-head { display:flex; align-items:flex-start; gap:11px; padding:15px 16px 13px; border-bottom:1px solid var(--line); }
    .review-card-mark { display:grid; place-items:center; flex:0 0 auto; width:28px; height:28px; border-radius:9px; color:#173000; background:var(--brand); font-size:13px; font-weight:750; }
    .review-card-title { margin:0; color:var(--ink); font-size:14px; font-weight:680; letter-spacing:-.01em; }
    .review-card-subtitle { margin:2px 0 0; color:var(--muted); font-size:12px; }
    .review-status { margin-left:auto; padding:3px 7px; border:1px solid var(--brand-soft); border-radius:99px; color:var(--brand-ink); background:var(--brand-soft); font-size:11px; white-space:nowrap; }
    .review-card-body { display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; padding:14px 16px; }
    .review-field { min-width:0; }
    .review-field.wide { grid-column:1 / -1; }
    .review-label { display:block; margin-bottom:5px; color:var(--muted); font-size:10px; font-weight:720; letter-spacing:.055em; text-transform:uppercase; }
    .review-value { color:var(--ink); font-size:12px; line-height:1.55; }
    .review-chips { display:flex; flex-wrap:wrap; gap:5px; }
    .review-chip { max-width:100%; overflow:hidden; padding:3px 7px; border:1px solid var(--line); border-radius:6px; color:var(--ink); background:var(--subtle); font:11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow:ellipsis; white-space:nowrap; }
    .review-safety { display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px; border-top:1px solid var(--line); color:var(--muted); background:var(--panel-muted); font-size:11px; }
    .review-safety span { display:inline-flex; align-items:center; gap:4px; }
    .review-safety span::before { width:5px; height:5px; border-radius:50%; background:var(--brand); content:""; }
    .review-card .msg-actions { padding:0 16px 15px; margin-top:0; }
    .review-code { max-height:150px; overflow-x:hidden; overflow-y:auto; margin:0 16px 14px; padding:10px; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:var(--subtle); font:11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; }
    .review-steps { display:grid; gap:10px; }
    .review-step { min-width:0; padding:10px 11px; border:1px solid var(--line); border-radius:10px; background:var(--subtle); }
    .review-step-title { color:var(--ink); font-size:12px; font-weight:700; }
    .review-step-summary { margin-top:4px; color:var(--muted); font-size:11px; line-height:1.5; }
    .review-step .review-code { margin:8px 0 0; max-height:120px; background:var(--panel); }
    .msg-actions { display:flex; gap:8px; margin-top:15px; }
    .btn { padding:7px 12px; border:1px solid #dededb; border-radius:7px; color:#454542; background:#fff; font-size:12px; font-weight:580; }
    .btn:hover { background:#f5f5f3; }
    .btn-primary { border-color:var(--brand-strong); color:#102000; background:var(--brand); }
    .btn-primary:hover { background:var(--brand-strong); }
    /* 重要确认操作：浅色半透明材质，轻微模糊以保持内容层次。 */
    .btn-confirm { display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border:1px solid rgba(35,35,32,.18); border-radius:11px; color:#20201e; background:rgba(255,255,255,.68); box-shadow:0 2px 11px rgba(27,27,24,.07), inset 0 1px 0 rgba(255,255,255,.92); backdrop-filter:blur(14px) saturate(135%); -webkit-backdrop-filter:blur(14px) saturate(135%); }
    .btn-confirm::before { width:7px; height:7px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); content:""; }
    .btn-confirm:hover { border-color:rgba(35,35,32,.3); color:#10100f; background:rgba(255,255,255,.88); box-shadow:0 5px 17px rgba(27,27,24,.11), inset 0 1px 0 #fff; transform:translateY(-1px); }
    .btn-confirm:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    .btn-confirm:disabled { cursor:wait; opacity:.62; transform:none; }
    .thinking { display:flex; align-items:center; gap:10px; margin:2px 0 22px 39px; color:#81817d; font-size:13px; }
    .thinking-dots { display:flex; gap:3px; }
    .thinking-dots span { width:4px; height:4px; border-radius:50%; background:#9b9b97; animation:blink 1.2s infinite; }
    .thinking-dots span:nth-child(2) { animation-delay:.15s; } .thinking-dots span:nth-child(3) { animation-delay:.3s; }
    @keyframes blink { 0%, 80%, 100% { opacity:.25; transform:scale(.8); } 40% { opacity:1; transform:scale(1); } }
    .composer-wrap { flex:0 0 auto; padding:16px 28px 22px; background:linear-gradient(to bottom, transparent, var(--panel) 20%); }
    .composer { display:flex; flex-direction:column; width:min(850px, 100%); min-height:104px; margin:0 auto; padding:14px 12px 10px 17px; border:1px solid var(--line); border-radius:18px; background:var(--panel); box-shadow:0 7px 26px rgba(31,31,28,.09), 0 1px 2px rgba(31,31,28,.05); }
    .composer:focus-within { border-color:var(--brand); box-shadow:0 8px 29px rgba(31,31,28,.11), 0 0 0 3px var(--focus); }
    .composer textarea { display:block; width:100%; min-height:31px; max-height:168px; padding:0; border:0; outline:0; resize:none; overflow-x:hidden; overflow-y:hidden; color:var(--ink); background:transparent; font-size:15px; line-height:1.62; white-space:pre-wrap; word-break:break-word; }
    .composer textarea::placeholder { color:#a2a29e; }
    .composer-controls { display:flex; align-items:center; gap:7px; margin-top:auto; }
    .composer-hint { margin-right:auto; color:#989894; font-size:11px; }
    .send { display:grid; place-items:center; width:34px; height:34px; border:0; border-radius:11px; color:#102000; background:var(--brand); font-size:17px; }
    .send:hover { background:var(--brand-strong); } .send:disabled { color:var(--muted); background:var(--subtle); cursor:not-allowed; }
    .inspector { display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--panel-muted); }
    .inspector-head { display:flex; align-items:center; min-height:52px; padding:0 13px 0 16px; border-bottom:1px solid var(--line); }
    .inspector-title { font-size:13px; font-weight:620; }
    .inspector-clear { margin-left:auto; padding:5px 7px; border:0; border-radius:6px; color:#81817d; background:transparent; font-size:11px; }
    .inspector-clear:hover { color:#3d3d3a; background:#ececea; }
    .run-status { display:flex; align-items:center; gap:7px; margin:14px 15px 9px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; color:var(--muted); background:var(--panel); font-size:12px; }
    .run-status-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); } .run-status.loading .run-status-dot, .run-status.success .run-status-dot { background:var(--brand); animation:blink 1.2s infinite; }
    .debug-content { flex:1 1 auto; min-height:0; overflow:auto; overscroll-behavior:contain; padding:0 15px 18px; }
    .debug-empty { padding:26px 6px; color:#999995; font-size:12px; text-align:center; }
    .debug-entry { margin:8px 0; padding:10px; border:1px solid #e8e8e4; border-radius:8px; background:#fff; }
    .debug-entry.error { border-color:#f1d8d5; background:#fffafa; } .debug-entry.success { border-color:#dcebe0; }
    .debug-entry .label { margin-bottom:5px; color:#565652; font-size:11px; font-weight:650; }
    .debug-entry .content { overflow:auto; max-height:185px; color:#747470; font:11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap; word-break:break-word; }
    .debug-entry { position:relative; margin:0 0 0 7px; padding:10px 10px 11px 16px; border:0; border-left:1px solid var(--line); border-radius:0; background:transparent; }
    .debug-entry::before { position:absolute; top:14px; left:-4px; width:7px; height:7px; border:2px solid var(--panel-muted); border-radius:50%; background:#a3a39f; content:""; }
    .debug-entry.success::before { background:var(--brand); } .debug-entry.error::before { background:var(--danger); }
    .debug-entry .content { max-height:125px; padding:7px 8px; border:1px solid var(--line); border-radius:6px; color:var(--muted); background:var(--panel); }
    .theme-dark .msg-content pre, .theme-dark .msg-content th { color:#d9ddd3; background:#242622; border-color:var(--line); }
    .theme-dark .msg-content code { background:#292b27; }
    .theme-dark .table-wrapper, .theme-dark .msg-content th, .theme-dark .msg-content td { border-color:var(--line); }
    .theme-dark .btn, .theme-dark .btn-confirm, .theme-dark .debug-entry { color:var(--ink); border-color:var(--line); background:rgba(37,39,35,.76); }
    .theme-dark .btn:hover, .theme-dark .btn-confirm:hover { background:#30322d; }
    .theme-dark .btn-primary { color:#102000; background:var(--brand); border-color:var(--brand); }
    .theme-dark .debug-entry.error { border-color:#703a35; background:#2d2020; }
    .theme-dark .debug-entry.success { border-color:#436529; }
    .theme-dark .debug-entry .label, .theme-dark .debug-entry .content, .theme-dark .thinking, .theme-dark .note, .theme-dark .empty-sessions, .theme-dark .composer-hint, .theme-dark .side-label, .theme-dark .footer-row { color:var(--muted); }
    .theme-dark .sandbox { border-color:#42632b; color:#b7ee86; background:#1e2b1a; }
    .theme-dark .review-card { box-shadow:0 8px 24px rgba(0,0,0,.18); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior:auto !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
    .mobile-inspector { display:none; }
    @media (max-width:1250px) { :root { --sidebar-width:226px; --inspector-width:300px; } .app { grid-template-columns:var(--sidebar-width) 7px minmax(500px, 1fr) 7px var(--inspector-width); } }
    @media (max-width:1050px) { body { min-width:760px; } .app { grid-template-columns:var(--sidebar-width) 7px minmax(500px, 1fr); } .inspector, .panel-resizer[data-panel="inspector"] { display:none; } .mobile-inspector { display:grid; } }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand-row"><div class="brand"><span class="brand-mark">F</span><span>Finance Agent</span></div><button class="icon-button" title="搜索会话">⌕</button></div>
      <button class="new-chat" id="newChat"><span class="plus">＋</span>新建对话</button>
      <section class="side-section"><div class="side-label"><span>最近对话</span><span id="sessionCount"></span></div><div class="session-list" id="sessionList"><div class="empty-sessions">正在加载会话…</div></div></section>
      <div class="sidebar-footer"><div class="footer-row"><span class="footer-dot"></span><span>本地开发环境</span></div></div>
    </aside>
    <div class="panel-resizer" data-panel="sidebar" role="separator" aria-label="调整会话栏宽度" aria-orientation="vertical" tabindex="0"></div>
    <section class="workspace">
      <header class="topbar"><div class="conversation-title" id="conversationTitle">新对话</div><div class="topbar-actions"><button class="icon-button" title="切换深色模式" aria-label="切换深色模式" id="themeToggle">◐</button><button class="icon-button" title="删除当前对话" id="deleteSession">⌫</button><button class="icon-button" title="清空模型可见记忆" id="clearMemory">◌</button><button class="icon-button mobile-inspector" title="运行详情">☷</button></div></header>
      <div class="conversation" id="conversation"><div class="messages" id="messages"><div class="welcome" id="empty"><div class="welcome-mark">F</div><h1>今天想分析什么？</h1><p>我可以帮你梳理财务数据、准备查询方法，并在确认后运行受控分析。</p><div class="suggestions"><button class="suggestion" data-prompt="统计每个交易状态有多少笔">统计交易状态</button><button class="suggestion" data-prompt="分析最近的交易趋势">分析交易趋势</button><button class="suggestion" data-prompt="查询 Company 5 的 KYC 状态">查询 KYC 状态</button></div></div></div></div>

  <script>
    var messagesEl = document.getElementById("messages"), conversationEl = document.getElementById("conversation"), emptyEl = document.getElementById("empty"), inputEl = document.getElementById("input"), submitBtn = document.getElementById("submit"), debugContent = document.getElementById("debugContent"), sessionList = document.getElementById("sessionList"), currentSessionId = null, currentRequestId = null, pendingReviewRequestId = null;
    var titleEl = document.getElementById("conversationTitle"), runStatus = document.getElementById("runStatus"), runStatusText = document.getElementById("runStatusText");

    function escapeHtml(text) { return String(text == null ? "" : text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;"); }
    function scrollToBottom() { conversationEl.scrollTop = conversationEl.scrollHeight; }
    function setRunStatus(text, type) { runStatus.className = "run-status" + (type ? " " + type : ""); runStatusText.textContent = text; }
    function applyTheme(theme) { var dark=theme === "dark"; document.body.classList.toggle("theme-dark",dark); var toggle=document.getElementById("themeToggle"); toggle.textContent=dark ? "☀" : "◐"; toggle.title=dark ? "切换浅色模式" : "切换深色模式"; toggle.setAttribute("aria-label",toggle.title); }
    function initializeTheme() { var saved=localStorage.getItem("finance-agent-theme"); applyTheme(saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")); }
    function toggleTheme() { var next=document.body.classList.contains("theme-dark") ? "light" : "dark"; localStorage.setItem("finance-agent-theme",next); applyTheme(next); }
    function clearMessages() { messagesEl.innerHTML = '<div class="welcome" id="empty"><div class="welcome-mark">F</div><h1>今天想分析什么？</h1><p>我可以帮你梳理财务数据、准备查询方法，并在确认后运行受控分析。</p><div class="suggestions"><button class="suggestion" data-prompt="统计每个交易状态有多少笔">统计交易状态</button><button class="suggestion" data-prompt="分析最近的交易趋势">分析交易趋势</button><button class="suggestion" data-prompt="查询 Company 5 的 KYC 状态">查询 KYC 状态</button></div></div>'; emptyEl = document.getElementById("empty"); bindSuggestions(); }
    function copyText(value) { if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(value); return new Promise(function(resolve,reject){ var area=document.createElement("textarea"); area.value=value; area.style.position="fixed"; area.style.opacity="0"; document.body.appendChild(area); area.select(); try { document.execCommand("copy"); area.remove(); resolve(); } catch(error) { area.remove(); reject(error); } }); }
    function messageText(content) { var clone=content.cloneNode(true); clone.querySelectorAll(".msg-actions,.review-card,.message-tools").forEach(function(node){node.remove();}); return (clone.innerText || "").trim(); }
    function copyMessageContent(content, button) { var value=messageText(content); if(!value) return; var tools=button.parentElement; copyText(value).then(function(){ button.textContent="✓"; tools.classList.add("copied"); button.title="已复制"; setTimeout(function(){button.textContent="⧉";tools.classList.remove("copied");button.title="复制消息";},1400); }).catch(function(){ button.title="复制失败"; }); }
    function resizeComposerInput() { inputEl.style.height="auto"; var maxHeight=168, nextHeight=Math.min(inputEl.scrollHeight,maxHeight); inputEl.style.height=nextHeight+"px"; inputEl.style.overflowY=inputEl.scrollHeight > maxHeight ? "auto" : "hidden"; }
    function editUserMessage(content) { var value=messageText(content); if(!value) return; inputEl.value=value; resizeComposerInput(); inputEl.focus(); inputEl.select(); document.querySelector(".composer-hint").textContent="正在编辑 · Enter 重新发送"; }
    function addMessageTool(tools, label, icon, onClick) { var button=document.createElement("button"); button.className="message-tool"; button.type="button"; button.title=label; button.setAttribute("aria-label",label); button.textContent=icon; button.onclick=onClick; tools.appendChild(button); return button; }
    function addMsg(role, html) { if (emptyEl) emptyEl.remove(); var div=document.createElement("article"); div.className="msg "+role; if (role === "bot") { var avatar=document.createElement("div"); avatar.className="msg-avatar"; avatar.textContent="F"; div.appendChild(avatar); } var content=document.createElement("div"); content.className="msg-content"; content.innerHTML=html; var tools=document.createElement("div"); tools.className="message-tools"; if(role === "bot") { var copyButton=addMessageTool(tools,"复制消息","⧉",function(){copyMessageContent(content,copyButton);}); } else { var userCopyButton=addMessageTool(tools,"复制消息","⧉",function(){copyMessageContent(content,userCopyButton);}); addMessageTool(tools,"编辑消息","✎",function(){editUserMessage(content);}); } content.appendChild(tools); div.appendChild(content); messagesEl.appendChild(div); scrollToBottom(); return content; }
    function addThinking() { if (document.getElementById("thinking")) return; if (emptyEl) emptyEl.remove(); var el=document.createElement("div"); el.className="thinking"; el.id="thinking"; el.innerHTML='<span>正在思考</span><span class="thinking-dots"><span></span><span></span><span></span></span>'; messagesEl.appendChild(el); scrollToBottom(); }
    function removeThinking() { var el=document.getElementById("thinking"); if (el) el.remove(); }
    function setLoading(loading) { submitBtn.disabled=loading; submitBtn.textContent=loading ? "·" : "↑"; if (loading) { addThinking(); setRunStatus("正在准备分析…", "loading"); } else { removeThinking(); } }
    function addDebugEntry(label, content, type) { if (debugContent.querySelector(".debug-empty")) debugContent.innerHTML=""; var entry=document.createElement("div"); entry.className="debug-entry"+(type ? " "+type : ""); entry.innerHTML='<div class="label">'+escapeHtml(label)+'</div><div class="content"></div>'; entry.querySelector(".content").textContent=typeof content === "string" ? content : JSON.stringify(content, null, 2); debugContent.appendChild(entry); debugContent.scrollTop=debugContent.scrollHeight; }
    function clearDebug() { debugContent.innerHTML='<div class="debug-empty">规划、校验和执行信息会显示在这里。</div>'; setRunStatus("等待新的请求"); }
    function formatInlineMarkdown(value) { return value.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_\n]+)__/g,"<strong>$1</strong>"); }
    function formatAnswer(answer) { var codeBlocks=[]; var source=escapeHtml(answer || "未生成回复").replace(/```(?:sql|python)?\r?\n([\s\S]*?)```/gi,function(_,code){var token="@@CODEBLOCK"+codeBlocks.length+"@@";codeBlocks.push("<pre>"+code.trim()+"</pre>");return token;}); var lines=source.split(/\r?\n/), html=[], paragraph=[], bullets=[]; function flushParagraph(){if(paragraph.length){html.push("<p>"+paragraph.map(formatInlineMarkdown).join("<br>")+"</p>");paragraph=[];}} function flushBullets(){if(bullets.length){html.push("<ul>"+bullets.map(function(item){return "<li>"+formatInlineMarkdown(item)+"</li>";}).join("")+"</ul>");bullets=[];}} lines.forEach(function(line){var heading=line.match(/^(#{1,3})\s+(.+)$/), bullet=line.match(/^\s*[-*]\s+(.+)$/), codeToken=line.match(/^@@CODEBLOCK(\d+)@@$/); if(!line.trim()){flushParagraph();flushBullets();return;} if(codeToken){flushParagraph();flushBullets();html.push(codeBlocks[Number(codeToken[1])]);return;} if(heading){flushParagraph();flushBullets();html.push("<h"+heading[1].length+">"+formatInlineMarkdown(heading[2])+"</h"+heading[1].length+">");return;} if(bullet){flushParagraph();bullets.push(bullet[1]);return;} flushBullets();paragraph.push(line);}); flushParagraph();flushBullets(); return html.join(""); }
    function formatResult(result) { if (!Array.isArray(result) || !result.length) return '<div class="sandbox">查询结果为空</div>'; var rows=result.slice(0,20), cols=Object.keys(rows[0]), html='<div class="table-wrapper"><table><thead><tr>'; cols.forEach(function(c){html+="<th>"+escapeHtml(c)+"</th>";}); html+="</tr></thead><tbody>"; rows.forEach(function(row){html+="<tr>"; cols.forEach(function(c){var v=row[c], display=typeof v === "number" ? v.toLocaleString(undefined,{maximumFractionDigits:2}) : String(v == null ? "" : v); html+='<td class="'+(typeof v === "number" ? "num" : "")+'">'+escapeHtml(display)+"</td>";}); html+="</tr>";}); html+="</tbody></table></div>"; if (result.length>20) html+='<div class="note">显示前 20 条，共 '+result.length+' 条</div>'; return html; }
    function formatExecutionCards(data) { var cards=Array.isArray(data.execution_result_cards) && data.execution_result_cards.length ? data.execution_result_cards : (data.execution_result_card ? [data.execution_result_card] : []); return cards.map(function(card,index){ var title=cards.length>1 ? '<div class="note" style="margin-top:12px;font-weight:600">步骤 '+(index+1)+' · '+escapeHtml(card.method_name || "查询")+'</div>' : ''; return title+formatResult(card.result); }).join(""); }
    function addActions(actions, target) { var holder=document.createElement("div"); holder.className="msg-actions"; actions.forEach(function(a){var btn=document.createElement("button"); btn.className="btn "+(a.primary ? "btn-primary " : "")+(a.confirm ? "btn-confirm" : ""); btn.textContent=a.label; btn.onclick=function(){ holder.querySelectorAll("button").forEach(function(item){item.disabled=true;}); a.onClick(); }; holder.appendChild(btn);}); if(target && target.classList.contains("review-card") && actions.some(function(action){return action.label === "确认执行";})) pendingReviewRequestId=currentRequestId; (target || messagesEl.querySelector(".msg:last-child .msg-content")).appendChild(holder); }
    function reviewChips(values) { return (values || []).map(function(value){return '<span class="review-chip" title="'+escapeHtml(value)+'">'+escapeHtml(value)+'</span>';}).join("") || '<span class="review-value">未指定</span>'; }
    function displayMethodName(method, fallbackName) { return method && method.method_type === "sql" ? "受控数据查询" : (method && method.method_type === "code" ? "受控计算" : (fallbackName || "分析方法")); }
    function reviewCardLegacy(data) { var methods=data.method_drafts || (data.method_draft ? [data.method_draft] : []), card=data.method_review_card || {}, fields=card.required_fields || (methods.length ? methods.reduce(function(all,method){return all.concat(method.required_fields || []);},[]) : []), uniqueFields=fields.filter(function(value,index){return fields.indexOf(value)===index;}), goal=card.goal || (methods[0] || {}).goal || "准备执行受控分析", rawName=card.method_name || (methods.length > 1 ? "方法集合" : ((methods[0] || {}).name || "分析方法")), name=methods.length > 1 ? rawName : displayMethodName(methods[0],rawName), logic=card.logic_summary || (methods[0] || {}).logic_summary || [], sql=data.sql || (methods[0] || {}).sql_template, tables=uniqueFields.map(function(field){return String(field).split(".")[0];}).filter(function(value,index,all){return value && all.indexOf(value)===index;}); (String(sql || "").match(/(?:FROM|JOIN)\s+([A-Za-z_][A-Za-z0-9_]*)/gi) || []).forEach(function(match){var table=match.replace(/(?:FROM|JOIN)\s+/i,""); if(tables.indexOf(table) === -1) tables.push(table);}); if(!tables.length && (methods[0] || {}).table) tables.push(methods[0].table); var html='<section class="review-card" aria-label="执行审查"><header class="review-card-head"><span class="review-card-mark">✓</span><div><h3 class="review-card-title">准备执行：'+escapeHtml(name)+'</h3><p class="review-card-subtitle">请确认本次方法与数据读取范围</p></div><span class="review-status">待确认</span></header><div class="review-card-body"><div class="review-field wide"><span class="review-label">分析目的</span><div class="review-value">'+escapeHtml(goal)+'</div></div><div class="review-field"><span class="review-label">读取范围</span><div class="review-chips">'+reviewChips(tables)+'</div></div><div class="review-field"><span class="review-label">涉及字段</span><div class="review-chips">'+reviewChips(uniqueFields)+'</div></div>'+(logic.length ? '<div class="review-field wide"><span class="review-label">执行逻辑</span><div class="review-value">'+escapeHtml(logic.join("；"))+'</div></div>' : '')+'</div>'+(sql ? '<pre class="review-code">'+escapeHtml(sql)+'</pre>' : '')+'<div class="review-safety"><span>只读校验</span><span>沙箱执行</span><span>确认后执行一次</span></div></section>'; return html; }
    function reviewCard(data) { var methods=data.method_drafts || (data.method_draft ? [data.method_draft] : []), aggregate=data.method_set_review_card || {}, card=data.method_review_card || {}, steps=aggregate.steps || data.method_review_cards || [], goal=aggregate.goal || card.goal || (methods[0] || {}).goal || "准备执行受控分析", fields=aggregate.required_fields || card.required_fields || methods.reduce(function(all,method){return all.concat(method.required_fields || []);},[]), uniqueFields=fields.filter(function(value,index){return fields.indexOf(value)===index;}), tables=uniqueFields.map(function(field){return String(field).split(".")[0];}).filter(function(value,index,all){return value && all.indexOf(value)===index;}); methods.forEach(function(method){if(method.table && tables.indexOf(method.table)===-1) tables.push(method.table);}); var html='<section class="review-card" aria-label="执行审查"><header class="review-card-head"><span class="review-card-mark">✓</span><div><h3 class="review-card-title">准备执行：'+(methods.length>1 ? '方法集合（'+methods.length+' 个步骤）' : escapeHtml(displayMethodName(methods[0],card.method_name || "分析方法")))+'</h3><p class="review-card-subtitle">请确认本次方法集合与数据读取范围</p></div><span class="review-status">待确认</span></header><div class="review-card-body"><div class="review-field wide"><span class="review-label">分析目的</span><div class="review-value">'+escapeHtml(goal)+'</div></div><div class="review-field"><span class="review-label">读取范围</span><div class="review-chips">'+reviewChips(tables)+'</div></div><div class="review-field"><span class="review-label">涉及字段</span><div class="review-chips">'+reviewChips(uniqueFields)+'</div></div><div class="review-field wide"><span class="review-label">执行步骤</span><div class="review-steps">'+methods.map(function(method,index){var step=steps[index] || {}, logic=step.logic_summary || method.logic_summary || []; return '<div class="review-step"><div class="review-step-title">步骤 '+(index+1)+'：'+escapeHtml(method.name || step.method_name || "分析方法")+'</div>'+(logic.length ? '<div class="review-step-summary">'+escapeHtml(logic.join("；"))+'</div>' : '')+(method.sql_template ? '<pre class="review-code">'+escapeHtml(method.sql_template)+'</pre>' : '')+'</div>';}).join("")+'</div></div><div class="review-safety"><span>只读校验</span><span>沙箱执行</span><span>确认后执行一次</span></div></section>'; return html; }
    function planReviewCard(data) { var card=data.analysis_plan_review_card || {}, plan=data.analysis_plan || {}, steps=card.steps || plan.steps || [], goal=card.goal || plan.goal || "准备分析计划"; var html='<section class="review-card" aria-label="分析计划审查"><header class="review-card-head"><span class="review-card-mark">1</span><div><h3 class="review-card-title">分析计划待确认</h3><p class="review-card-subtitle">确认计划后才会生成可执行方法</p></div><span class="review-status">待确认</span></header><div class="review-card-body"><div class="review-field wide"><span class="review-label">分析目的</span><div class="review-value">'+escapeHtml(goal)+'</div></div><div class="review-field wide"><span class="review-label">计划步骤</span><div class="review-chips">'+reviewChips(steps.map(function(step,index){return (index+1)+". "+(step.title || step.operation || step.rationale || "分析步骤");}))+'</div></div></div><div class="review-safety"><span>仅审查计划</span><span>尚未读取数据</span></div></section>'; return html; }

    async function loadSessions() { try { var res=await fetch("/v1/sessions"), sessions=await res.json(); document.getElementById("sessionCount").textContent=sessions.length || ""; sessionList.innerHTML=""; if(!sessions.length) sessionList.innerHTML='<div class="empty-sessions">还没有保存的对话</div>'; sessions.forEach(function(session){var item=document.createElement("div"); item.className="session"+(session.session_id===currentSessionId ? " active" : ""); item.title=session.title; item.tabIndex=0; item.setAttribute("role","button"); item.innerHTML='<span class="session-icon">'+(session.pinned ? "◆" : "◌")+'</span><span class="session-title">'+escapeHtml(session.title)+'</span><span class="session-actions"><button class="session-action '+(session.pinned ? "pin-active" : "")+'" title="'+(session.pinned ? "取消置顶" : "置顶")+'" aria-label="'+(session.pinned ? "取消置顶" : "置顶")+'">⌁</button><button class="session-action delete" title="删除对话" aria-label="删除对话">⌫</button></span>'; item.onclick=function(){switchSession(session.session_id, session.title);}; item.onkeydown=function(event){if(event.key === "Enter" || event.key === " "){event.preventDefault();switchSession(session.session_id, session.title);}}; item.querySelector(".session-action:not(.delete)").onclick=function(event){event.stopPropagation();toggleSessionPin(session.session_id,!session.pinned);}; item.querySelector(".session-action.delete").onclick=function(event){event.stopPropagation();deleteSessionById(session.session_id,session.title);}; sessionList.appendChild(item);}); return sessions; } catch(e) { sessionList.innerHTML='<div class="empty-sessions">无法加载会话</div>'; addDebugEntry("会话加载失败",e.message,"error"); return []; } }
    async function createNewSession() { var res=await fetch("/v1/sessions",{method:"POST"}); if(!res.ok) throw new Error("无法创建会话"); var session=await res.json(); currentSessionId=session.session_id; titleEl.textContent=session.title; clearMessages(); await loadSessions(); setRunStatus("新对话已创建"); return session; }
    function restoreRunDetail(detail) { if(!detail) return; debugContent.innerHTML=""; (detail.entries || []).forEach(function(entry){addDebugEntry(entry.label,entry.content,entry.type);}); setRunStatus(detail.status_text || "已完成",detail.status_type); }
    function restorePendingReview(data) { if(!data || !data.request_id) return; currentRequestId=data.request_id; var content=messagesEl.querySelector(".msg.bot:last-child .msg-content"); if(!content) content=addMsg("bot",formatAnswer(data.answer)); if(content.querySelector(".review-card")) return; if(data.status === "analysis_plan_review_ready") { content.insertAdjacentHTML("beforeend",planReviewCard(data)); addActions([{label:"确认计划",primary:true,onClick:function(){approve("analysis-plan",data.request_id);}},{label:"稍后调整",onClick:function(){inputEl.focus();}}],content.querySelector(".review-card")); setRunStatus("等待确认分析计划"); } else if(data.status === "method_review_ready") { content.insertAdjacentHTML("beforeend",reviewCard(data)); addActions([{label:"确认执行",confirm:true,onClick:function(){approve("method-review",data.request_id);}},{label:"修改方法",onClick:function(){inputEl.focus();}}],content.querySelector(".review-card")); setRunStatus("等待确认执行方法"); } else if(data.status === "prior_result_authorization_pending") { addActions([{label:"授权执行",primary:true,onClick:function(){approve("prior-result-authorization",data.request_id);}},{label:"取消",onClick:function(){setRunStatus("已取消");}}],content); setRunStatus("等待授权使用先前结果"); } }
    async function switchSession(sessionId, title) { if(!sessionId) return; currentSessionId=sessionId; titleEl.textContent=title || "对话"; clearMessages(); await loadSessions(); try { var res=await fetch("/v1/sessions/"+encodeURIComponent(sessionId)+"/history"), data=await res.json(); data.history.forEach(function(msg){addMsg(msg.role === "user" ? "user" : "bot", msg.role === "user" ? escapeHtml(msg.content) : formatAnswer(msg.content));}); restoreRunDetail(data.run_detail); restorePendingReview(data.pending_review); if(!data.pending_review && !data.run_detail) setRunStatus("已切换对话"); } catch(e) { addDebugEntry("历史加载失败",e.message,"error"); } }
    async function deleteSessionById(sessionId, title) { if(!confirm('确定要删除“'+title+'”吗？')) return; var res=await fetch("/v1/sessions/"+encodeURIComponent(sessionId),{method:"DELETE"}); if(!res.ok) throw new Error("无法删除对话"); if(sessionId === currentSessionId) { currentSessionId=null; clearMessages(); var sessions=await loadSessions(); if(sessions.length) { await switchSession(sessions[0].session_id,sessions[0].title); } else { await createNewSession(); } } else { await loadSessions(); } setRunStatus("对话已删除"); }
    async function deleteCurrentSession() { if(currentSessionId) await deleteSessionById(currentSessionId,titleEl.textContent || "当前对话"); }
    async function toggleSessionPin(sessionId, pinned) { var res=await fetch("/v1/sessions/"+encodeURIComponent(sessionId)+"/pin?pinned="+pinned,{method:"POST"}); if(!res.ok) throw new Error("无法更新置顶状态"); await loadSessions(); setRunStatus(pinned ? "对话已置顶" : "已取消置顶"); }
    async function clearMemory() { if(!confirm("确定要清空模型可见记忆吗？")) return; var res=await fetch("/api/clear-memory",{method:"POST"}); var data=await res.json(); addDebugEntry("记忆",data.message,"success"); setRunStatus("已清空模型可见记忆", "success"); }

    function handleResponse(data) { currentRequestId=data.request_id; var html=formatAnswer(data.answer), status=data.status, content; if((status === "executed_simulated_real" || status === "method_execution_failed") && (data.execution_result_card || data.execution_result_cards)) { html+=formatExecutionCards(data); if(status === "method_execution_failed") html+='<div class="sandbox" style="color:#a2342a">部分步骤执行失败 · 请查看上方错误信息</div>'; html+='<div class="sandbox">沙箱执行完成 · 当前未连接真实数据库</div>'; addMsg("bot",html); setRunStatus(status === "method_execution_failed" ? "部分步骤失败" : "分析已完成", status === "method_execution_failed" ? "error" : "success"); } else if(status === "method_execution_failed") { html+='<div class="sandbox" style="color:#a2342a">执行失败 · 请检查查询条件</div>'; addMsg("bot",html); setRunStatus("执行失败", "error"); } else { content=addMsg("bot",html); if(status === "analysis_plan_review_ready") { content.insertAdjacentHTML("beforeend",planReviewCard(data)); addActions([{label:"确认计划",primary:true,onClick:function(){approve("analysis-plan",data.request_id);}},{label:"稍后调整",onClick:function(){inputEl.focus();}}],content.querySelector(".review-card")); setRunStatus("等待确认分析计划"); } else if(status === "method_review_ready") { content.insertAdjacentHTML("beforeend",reviewCard(data)); addActions([{label:"确认执行",confirm:true,onClick:function(){approve("method-review",data.request_id);}},{label:"修改方法",onClick:function(){inputEl.focus();}}],content.querySelector(".review-card")); setRunStatus("等待确认执行方法"); } else if(status === "prior_result_authorization_pending") { addActions([{label:"授权执行",primary:true,onClick:function(){approve("prior-result-authorization",data.request_id);}},{label:"取消",onClick:function(){setRunStatus("已取消");}}],content); setRunStatus("等待授权使用先前结果"); } else { setRunStatus("已完成", "success"); } } }
    async function revisePendingMethod(instruction, requestId) { setLoading(true); addDebugEntry("修改方法",instruction); try { var res=await fetch("/v1/runs/"+encodeURIComponent(requestId)+"/method-review/revise",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({instruction:instruction})}), data=await res.json(); if(!res.ok) throw new Error(data.detail || "修改失败"); handleResponse(data); pendingReviewRequestId=data.status === "method_review_ready" ? data.request_id : null; loadSessions(); } catch(e) { addMsg("bot","修改失败："+escapeHtml(e.message)); addDebugEntry("修改失败",e.message,"error"); setRunStatus("修改失败", "error"); } finally { setLoading(false); } }
    async function approve(action, requestId) { setLoading(true); addDebugEntry("用户确认",action); try { var res=await fetch("/v1/runs/"+encodeURIComponent(requestId)+"/"+action+"/approve",{method:"POST"}), data=await res.json(); if(!res.ok) throw new Error(data.detail || "操作失败"); if(data.execution_result_cards && data.execution_result_cards.length) addDebugEntry("执行结果",data.execution_result_cards,"success"); else if(data.execution_result_card) addDebugEntry("执行结果",data.execution_result_card,"success"); pendingReviewRequestId=null; handleResponse(data); } catch(e) { addMsg("bot","操作失败："+escapeHtml(e.message)); addDebugEntry("操作失败",e.message,"error"); setRunStatus("操作失败", "error"); } finally { setLoading(false); } }
    async function submit() { var text=inputEl.value.trim(); if(!text) return; if(pendingReviewRequestId) { addMsg("user",escapeHtml(text)); inputEl.value=""; resizeComposerInput(); document.querySelector(".composer-hint").textContent="Enter 发送 · Shift+Enter 换行"; await revisePendingMethod(text,pendingReviewRequestId); return; } try { if(!currentSessionId) await createNewSession(); addMsg("user",escapeHtml(text)); inputEl.value=""; resizeComposerInput(); document.querySelector(".composer-hint").textContent="Enter 发送 · Shift+Enter 换行"; setLoading(true); clearDebug(); addDebugEntry("用户问题",text); var source=new EventSource("/v1/runs/stream?question="+encodeURIComponent(text)+"&session_id="+encodeURIComponent(currentSessionId)); source.onmessage=function(event){var payload=JSON.parse(event.data); if(payload.type === "start") { addDebugEntry("请求",payload.message); } else if(payload.type === "response_plan") { addDebugEntry("响应规划",payload.data); } else if(payload.type === "action_validation") { addDebugEntry("安全校验",payload.data); } else if(payload.type === "method_draft") { addDebugEntry("方法草稿",payload.data); } else if(payload.type === "sql") { addDebugEntry("SQL",payload.data); } else if(payload.type === "errors") { addDebugEntry("错误",payload.data,"error"); } else if(payload.type === "complete") { handleResponse(payload.data); source.close(); setLoading(false); loadSessions(); } else if(payload.type === "error") { addMsg("bot","请求失败："+escapeHtml(payload.message)); addDebugEntry("请求失败",payload.message,"error"); source.close(); setLoading(false); setRunStatus("请求失败", "error"); }}; source.onerror=function(){ if(source.readyState !== EventSource.CLOSED) { addDebugEntry("连接", "SSE 连接已断开", "error"); setRunStatus("连接已断开", "error"); } source.close(); setLoading(false); }; } catch(e) { addMsg("bot","请求失败："+escapeHtml(e.message)); setLoading(false); } }
    function bindPanelResizers() { document.querySelectorAll(".panel-resizer").forEach(function(resizer){ var panel=resizer.dataset.panel; function resize(clientX) { var min=panel === "sidebar" ? 180 : 250, max=panel === "sidebar" ? 420 : 560, edge=panel === "sidebar" ? clientX : window.innerWidth-clientX; var workspaceMin=window.innerWidth < 1050 ? 500 : 540, opposite=window.innerWidth < 1050 ? 0 : parseInt(getComputedStyle(document.documentElement).getPropertyValue(panel === "sidebar" ? "--inspector-width" : "--sidebar-width"),10); max=Math.min(max,window.innerWidth-workspaceMin-opposite-14); var width=Math.max(min,Math.min(max,edge)); document.documentElement.style.setProperty(panel === "sidebar" ? "--sidebar-width" : "--inspector-width",width+"px"); } resizer.addEventListener("pointerdown",function(event){ event.preventDefault(); resizer.classList.add("dragging"); document.body.classList.add("is-resizing"); resizer.setPointerCapture(event.pointerId); var move=function(e){resize(e.clientX);}; var stop=function(){resizer.classList.remove("dragging");document.body.classList.remove("is-resizing");resizer.removeEventListener("pointermove",move);resizer.removeEventListener("pointerup",stop);resizer.removeEventListener("pointercancel",stop);}; resizer.addEventListener("pointermove",move);resizer.addEventListener("pointerup",stop);resizer.addEventListener("pointercancel",stop); }); resizer.addEventListener("keydown",function(event){if(event.key !== "ArrowLeft" && event.key !== "ArrowRight") return; event.preventDefault(); var current=parseInt(getComputedStyle(document.documentElement).getPropertyValue(panel === "sidebar" ? "--sidebar-width" : "--inspector-width"),10), delta=(event.key === "ArrowRight" ? 16 : -16) * (panel === "sidebar" ? 1 : -1); document.documentElement.style.setProperty(panel === "sidebar" ? "--sidebar-width" : "--inspector-width",Math.max(panel === "sidebar" ? 180 : 250,Math.min(panel === "sidebar" ? 420 : 560,current+delta))+"px"); }); }); }
    function bindSuggestions(){ document.querySelectorAll(".suggestion").forEach(function(btn){btn.onclick=function(){inputEl.value=btn.dataset.prompt; submit();};}); }
    document.getElementById("form").addEventListener("submit",function(e){e.preventDefault();submit();}); inputEl.addEventListener("input",resizeComposerInput); inputEl.addEventListener("keydown",function(event){if(event.key === "Enter" && !event.shiftKey && !event.isComposing){event.preventDefault();submit();}}); document.getElementById("newChat").onclick=function(){createNewSession().catch(function(e){addDebugEntry("新建会话失败",e.message,"error");});}; document.getElementById("deleteSession").onclick=function(){deleteCurrentSession().catch(function(e){addDebugEntry("删除对话失败",e.message,"error");});}; document.getElementById("themeToggle").onclick=toggleTheme; document.getElementById("clearMemory").onclick=clearMemory; document.getElementById("clearDebug").onclick=clearDebug; initializeTheme(); bindPanelResizers(); bindSuggestions(); resizeComposerInput();
    loadSessions().then(function(sessions){if(sessions.length){switchSession(sessions[0].session_id,sessions[0].title);} else {createNewSession().catch(function(e){addDebugEntry("初始化失败",e.message,"error");});}});
  </script>
