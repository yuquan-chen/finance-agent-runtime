<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Agent</title>
  <style>
    :root { --bg:#fbfbfa; --panel:#ffffff; --panel-muted:#f8f8f7; --ink:#20201f; --muted:#777774; --line:#e8e8e5; --subtle:#f4f4f1; --accent:#131311; --brand:rgb(100,191,4); --brand-strong:#4c9301; --brand-ink:#315f02; --brand-soft:rgba(100,191,4,.13); --focus:rgba(100,191,4,.24); --danger:#c53d31; --sidebar-width:248px; --inspector-width:348px; --panel-gap:14px; --shell-inset:12px; --surface-shadow:0 1px 2px rgba(29,34,24,.035),0 8px 24px rgba(29,34,24,.035); }
    body.theme-dark { --bg:#161715; --panel:#1d1e1b; --panel-muted:#1a1b19; --ink:#f0f1ed; --muted:#a9aaa4; --line:#32342f; --subtle:#272925; --accent:#eff1ec; --brand:#8ee038; --brand-strong:#a3ea59; --brand-ink:#b8f579; --brand-soft:rgba(142,224,56,.16); --focus:rgba(142,224,56,.28); --danger:#ff8e83; color-scheme:dark; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; }
    body { min-width:1024px; color:var(--ink); background:var(--bg); font:14px/1.55 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, textarea { font:inherit; }
    button { cursor:pointer; }
    .app { display:grid; grid-template-columns:var(--sidebar-width) var(--panel-gap) minmax(540px, 1fr) var(--panel-gap) var(--inspector-width); height:100vh; height:100dvh; min-height:0; padding:var(--shell-inset); overflow:hidden; background:var(--bg); }
    .app.inspector-collapsed { grid-template-columns:var(--sidebar-width) var(--panel-gap) minmax(540px, 1fr); }
    .app.inspector-collapsed .panel-resizer[data-panel="inspector"], .app.inspector-collapsed .inspector { display:none; }
    .sidebar { display:flex; flex-direction:column; min-width:0; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--panel-muted); padding:15px 11px 12px; box-shadow:var(--surface-shadow); }
    .panel-resizer { position:relative; z-index:3; width:var(--panel-gap); cursor:col-resize; background:transparent; touch-action:none; }
    .panel-resizer::after { position:absolute; top:calc(50% - 21px); left:calc(50% - 1px); width:2px; height:42px; border-radius:99px; background:var(--line); content:""; opacity:0; transition:opacity .15s, background .15s, box-shadow .15s; }
    .panel-resizer:hover::after, .panel-resizer.dragging::after { background:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); opacity:1; }
    .panel-resizer:focus-visible { outline:0; }
    .panel-resizer:focus-visible::after { background:var(--brand); box-shadow:0 0 0 3px var(--focus); }
    body.is-resizing { cursor:col-resize; user-select:none; }
    .brand-row { display:flex; align-items:center; justify-content:space-between; padding:3px 7px 15px; }
    .brand { display:flex; align-items:center; gap:8px; font-size:16px; font-weight:650; letter-spacing:-.02em; }
    .brand-mark { display:grid; place-items:center; width:23px; height:23px; color:#102000; background:var(--brand); border-radius:7px; font-size:12px; }
    .icon-button { display:grid; place-items:center; width:30px; height:30px; border:0; border-radius:7px; color:var(--muted); background:transparent; font-size:18px; }
    .icon-button:hover { background:var(--subtle); color:var(--ink); }
    .new-chat { display:flex; align-items:center; gap:9px; width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:9px; color:var(--ink); background:var(--panel); text-align:left; font-weight:550; box-shadow:0 1px 1px rgba(0,0,0,.02); }
    .new-chat:hover { background:var(--subtle); border-color:var(--brand); }
    .new-chat .plus { font-size:20px; font-weight:300; line-height:12px; }
    .side-section { margin-top:25px; }
    .side-label { display:flex; justify-content:space-between; align-items:center; padding:0 8px 7px; color:#92928e; font-size:11px; font-weight:650; letter-spacing:.04em; text-transform:uppercase; }
    .session-list { display:flex; flex-direction:column; gap:2px; overflow:auto; max-height:calc(100vh - 210px); }
    .session { display:flex; align-items:center; gap:9px; width:100%; min-width:0; padding:8px 8px; border:0; border-radius:7px; color:#555552; background:transparent; text-align:left; cursor:pointer; }
    .session:hover { background:var(--subtle); color:var(--ink); }
    .session.active { color:var(--ink); background:var(--brand-soft); font-weight:560; }
    .session-icon { flex:0 0 auto; color:#858581; font-size:14px; }
    .session-title { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .session-actions { display:flex; align-items:center; gap:1px; margin-left:auto; opacity:0; transition:opacity .16s; }
    .session:hover .session-actions, .session:focus-within .session-actions { opacity:1; }
    .session-action { display:grid; place-items:center; width:23px; height:23px; padding:0; border:0; border-radius:6px; color:var(--muted); background:transparent; font-size:13px; }
    .session-action:hover { color:var(--ink); background:var(--panel); }
    .session-action.pin-active { color:var(--brand-ink); background:var(--brand-soft); }
    .session-action.delete:hover { color:var(--danger); }
    .empty-sessions { padding:9px 8px; color:#999995; font-size:12px; }
    .sidebar-footer { margin-top:auto; padding:12px 4px 0; border-top:1px solid var(--line); }
    .footer-row { display:flex; align-items:center; gap:8px; padding:8px 5px; color:#71716e; font-size:12px; }
    .footer-dot { width:7px; height:7px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
    .workspace { display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:var(--surface-shadow); }
    .topbar { position:relative; display:flex; align-items:center; min-height:52px; padding:0 20px; border-bottom:1px solid var(--line); }
    .conversation-title { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:14px; font-weight:580; }
    .topbar-actions { display:flex; align-items:center; gap:3px; margin-left:auto; }
    .topbar-actions .icon-button { width:32px; height:32px; font-size:16px; }
    .side-tools-toggle { position:fixed; z-index:40; top:11px; right:12px; }
    .side-tools-toggle.active { color:var(--ink); background:var(--subtle); }
    .inspector-menu { position:absolute; z-index:39; top:52px; left:12px; width:220px; max-width:calc(100% - 24px); padding:7px; border:1px solid var(--line); border-radius:11px; background:var(--panel); box-shadow:0 12px 30px rgba(31,31,28,.16),0 2px 5px rgba(31,31,28,.05); }
    .inspector-menu[hidden] { display:none; }
    .inspector-menu-option { display:flex; align-items:center; gap:10px; width:100%; min-height:38px; padding:8px 9px; border:0; border-radius:8px; color:var(--ink); background:transparent; text-align:left; }
    .inspector-menu-option:hover, .inspector-menu-option:focus-visible { background:var(--subtle); outline:0; }
    .inspector-menu-icon { display:grid; place-items:center; flex:0 0 auto; width:22px; height:22px; color:var(--muted); font-size:16px; }
    .inspector-menu-copy { display:flex; flex:1 1 auto; flex-direction:column; min-width:0; line-height:1.35; }
    .inspector-menu-copy strong { font-size:12px; font-weight:650; }
    .inspector-menu-copy small { color:var(--muted); font-size:10px; }
    .inspector-menu kbd { padding:2px 6px; border:0; border-radius:99px; color:var(--muted); background:var(--subtle); font:10px ui-monospace,monospace; white-space:nowrap; }
    .inspector-launcher { display:flex; flex:1 1 auto; align-items:center; justify-content:center; min-height:0; padding:30px 20px; }
    .inspector-launcher[hidden] { display:none; }
    .inspector-launcher-card { width:min(100%, 360px); padding:28px 24px; border:1px solid var(--line); border-radius:16px; background:var(--panel); box-shadow:0 12px 30px rgba(31,31,28,.07); }
    .inspector-launcher-title { margin:0; color:var(--ink); font-size:15px; font-weight:700; text-align:center; }
    .inspector-launcher-subtitle { margin:5px 0 0; color:var(--muted); font-size:11px; line-height:1.5; text-align:center; }
    .inspector-launcher-options { display:grid; gap:9px; margin-top:22px; }
    .inspector-launcher-option { display:flex; align-items:center; gap:11px; width:100%; min-height:58px; padding:11px 13px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:var(--panel); text-align:left; transition:border-color .15s, background .15s, transform .15s; }
    .inspector-launcher-option:hover, .inspector-launcher-option:focus-visible { border-color:var(--brand); background:var(--brand-soft); outline:0; transform:translateY(-1px); }
    .inspector-launcher-icon { display:grid; place-items:center; flex:0 0 auto; width:28px; height:28px; border-radius:8px; color:var(--brand-ink); background:var(--brand-soft); font-size:17px; }
    .inspector-launcher-copy { display:flex; flex-direction:column; min-width:0; gap:2px; }
    .inspector-launcher-copy strong { font-size:13px; font-weight:680; }
    .inspector-launcher-copy small { color:var(--muted); font-size:10px; }
    .conversation { flex:1 1 auto; min-height:0; overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain; scroll-behavior:smooth; scrollbar-gutter:stable; }
    .messages { width:min(810px, calc(100% - 56px)); margin:0 auto; padding:42px 0 24px; }
    .welcome { display:flex; flex-direction:column; align-items:flex-start; justify-content:center; min-height:calc(100vh - 230px); padding:0 9%; }
    .welcome-mark { display:grid; place-items:center; width:39px; height:39px; margin-bottom:19px; border-radius:11px; color:#102000; background:var(--brand); font-weight:700; }
    .welcome h1 { margin:0; font-size:27px; line-height:1.25; letter-spacing:-.04em; }
    .welcome p { max-width:510px; margin:10px 0 22px; color:var(--muted); font-size:15px; }
    .suggestions { display:flex; flex-wrap:wrap; gap:8px; }
    .suggestion { padding:7px 11px; border:1px solid var(--line); border-radius:18px; color:var(--muted); background:var(--panel); font-size:12px; }
    .suggestion:hover { border-color:var(--brand); color:var(--brand-ink); background:var(--brand-soft); }
    .msg { display:flex; gap:12px; margin-bottom:37px; }
    .msg-avatar { display:grid; place-items:center; flex:0 0 auto; width:27px; height:27px; margin-top:1px; border-radius:8px; color:#102000; background:var(--brand); font-size:11px; font-weight:700; }
    .msg.user { justify-content:flex-end; }
    .msg.user .msg-avatar { display:none; }
    .msg-content { min-width:0; max-width:calc(100% - 39px); color:var(--ink); white-space:pre-wrap; word-break:break-word; }
    .msg.user .msg-content { max-width:75%; padding:9px 13px; border-radius:16px 16px 4px 16px; background:var(--brand-soft); }
    .msg.user .msg-content.has-message-attachments { padding:0; background:transparent; }
    .message-attachment-content { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
    .message-image-grid { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; max-width:min(75vw, 324px); }
    .message-image { display:block; width:152px; height:112px; border:1px solid var(--line); border-radius:13px 13px 4px 13px; object-fit:cover; background:var(--subtle); box-shadow:0 2px 8px rgba(31,31,28,.06); }
    .message-file-list { display:grid; gap:6px; width:min(100%, 300px); }
    .message-file { display:flex; align-items:center; gap:10px; min-width:0; padding:9px 11px; border:1px solid var(--line); border-radius:13px 13px 4px 13px; background:var(--panel); box-shadow:0 2px 8px rgba(31,31,28,.045); }
    .message-file-icon { display:grid; place-items:center; flex:0 0 auto; width:36px; height:36px; border-radius:9px; color:#b42318; background:#fff1f0; font-size:10px; font-weight:800; }
    .message-file-icon.generic { color:var(--brand-ink); background:var(--brand-soft); }
    .message-file-meta { display:flex; flex-direction:column; min-width:0; gap:2px; text-align:left; }
    .message-file-name { overflow:hidden; color:var(--ink); font-size:12px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
    .message-file-type { color:var(--muted); font-size:11px; }
    .message-text-bubble { max-width:100%; padding:9px 13px; border-radius:16px 16px 4px 16px; color:var(--ink); background:var(--brand-soft); white-space:pre-wrap; word-break:break-word; text-align:left; }
    .msg-content { position:relative; }
    .msg.bot .msg-content { padding:2px 0; font-size:14px; line-height:1.72; white-space:normal; }
    .message-tools { position:absolute; top:calc(100% + 4px); left:0; display:flex; align-items:center; gap:2px; opacity:0; transition:opacity .15s; }
    .msg.user .message-tools { right:0; left:auto; }
    .msg-content:hover .message-tools, .msg-content:focus-within .message-tools, .message-tools.copied { opacity:1; }
    .message-tool { display:grid; place-items:center; width:26px; height:24px; padding:0; border:1px solid transparent; border-radius:6px; color:var(--muted); background:transparent; font-size:14px; transition:color .15s, background .15s, border-color .15s; }
    .message-tool:hover { border-color:var(--line); color:var(--ink); background:var(--subtle); }
    .message-tool:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    .msg-content h1, .msg-content h2, .msg-content h3 { margin:10px 0 5px; color:var(--ink); line-height:1.35; letter-spacing:-.02em; }
    .msg-content h1 { font-size:19px; } .msg-content h2 { font-size:17px; } .msg-content h3 { font-size:15px; }
    .msg-content p { margin:0 0 10px; } .msg-content ul { margin:4px 0 10px; padding-left:21px; } .msg-content li { margin:2px 0; }
    .msg-content strong { color:var(--ink); font-weight:760; }
    .msg-content u { color:var(--danger); font-weight:680; text-decoration-color:rgba(197,61,49,.6); text-decoration-thickness:1.5px; text-underline-offset:3px; }
    .msg-content pre { overflow:auto; margin:12px 0; padding:14px; border:1px solid #e5e5e1; border-radius:9px; color:#343430; background:#f7f7f5; font:12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
    .msg-content code { padding:1px 4px; border-radius:4px; background:#f0f0ed; font:12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .result-table { width:min(100%, 840px); margin:14px 0 16px; padding:10px; border:1px solid var(--brand-soft); border-radius:15px; background:var(--brand-soft); }
    .result-insights { display:grid; gap:10px; margin-bottom:10px; }
    .result-metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .result-metric { min-width:0; padding:10px 11px; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
    .result-metric-label { overflow:hidden; color:var(--muted); font-size:11px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
    .result-metric-value { overflow:hidden; margin-top:2px; color:var(--ink); font-size:17px; font-weight:760; font-variant-numeric:tabular-nums; letter-spacing:-.02em; text-overflow:ellipsis; white-space:nowrap; }
    .trend-chart { overflow:hidden; padding:10px 11px 7px; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
    .trend-chart-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 1px 5px; }
    .trend-chart-title { color:var(--ink); font-size:12px; font-weight:740; }
    .trend-chart-note { color:var(--muted); font-size:11px; white-space:nowrap; }
    .trend-chart svg { display:block; width:100%; height:auto; overflow:visible; }
    .trend-grid-line { stroke:var(--line); stroke-width:1; }
    .trend-zero-line { stroke:var(--muted); stroke-width:1; opacity:.55; }
    .trend-area { fill:var(--brand-soft); }
    .trend-line { fill:none; stroke:var(--brand); stroke-width:2.25; stroke-linecap:round; stroke-linejoin:round; }
    .trend-dot { fill:var(--brand); stroke:var(--panel); stroke-width:1.5; }
    .trend-axis-label { fill:var(--muted); font:11px Inter,ui-sans-serif,sans-serif; }
    @media (max-width:640px) { .result-metrics { grid-template-columns:1fr; } .result-metric { display:flex; align-items:baseline; justify-content:space-between; gap:12px; } .result-metric-value { margin-top:0; } .trend-chart-note { display:none; } }
    .table-wrapper { width:100%; max-height:430px; overflow:auto; margin:0; border:1px solid #e1e2dd; border-radius:10px; background:var(--panel); box-shadow:0 5px 15px rgba(31,31,28,.045); }
    .msg-content table { width:100%; min-width:520px; border-collapse:separate; border-spacing:0; font-size:13px; font-variant-numeric:tabular-nums; }
    .msg-content th, .msg-content td { padding:8px 12px; border-bottom:1px solid #eeefeb; text-align:left; white-space:nowrap; }
    .msg-content th { position:sticky; top:0; z-index:1; color:#292a27; background:#f5f6f2; font-size:12px; font-weight:800; letter-spacing:.015em; box-shadow:0 1px 0 #e6e7e2; }
    .msg-content tbody tr:nth-child(even) td { background:#fbfcf9; }
    .msg-content tbody tr:hover td { background:var(--brand-soft); }
    .msg-content td { color:var(--ink); }
    .msg-content th.numeric, .msg-content td.numeric { text-align:right; }
    .msg-content td.negative { color:var(--danger); font-weight:620; }
    .msg-content td.date { color:var(--ink); font-size:13px; font-weight:650; letter-spacing:0; }
    .msg-content tr:last-child td { border-bottom:0; }
    .data-table-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:27px; padding:7px 2px 0; }
    .data-table-summary { display:flex; align-items:center; gap:5px; margin:0; color:var(--muted); font-size:11px; white-space:nowrap; }
    .data-table-summary strong { color:var(--ink); font-weight:680; }
    .table-pagination { display:flex; align-items:center; justify-content:flex-end; gap:7px; margin:0; color:var(--muted); font-size:11px; white-space:nowrap; }
    .table-pagination button { padding:4px 8px; border:1px solid var(--line); border-radius:6px; color:var(--ink); background:var(--panel); font-size:11px; font-weight:650; }
    .table-pagination button:hover:not(:disabled) { border-color:var(--brand-strong); background:var(--brand-soft); }
    .table-pagination button:disabled { color:var(--muted); cursor:not-allowed; opacity:.55; }
    .msg-content td.num { text-align:right; font-variant-numeric:tabular-nums; }
    .note { margin-top:7px; color:#858582; font-size:12px; }
    .sandbox { margin-top:13px; padding:9px 11px; border:1px solid #dbe9df; border-radius:8px; color:#38704a; background:#f4faf5; font-size:12px; }
    .review-card { margin:15px 0 3px; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:0 8px 24px rgba(24,30,19,.06); }
    .review-card-head { display:flex; align-items:flex-start; gap:11px; padding:15px 16px 13px; border-bottom:1px solid var(--line); }
    .review-card-mark { display:grid; place-items:center; flex:0 0 auto; width:28px; height:28px; border-radius:9px; color:#173000; background:var(--brand); font-size:13px; font-weight:750; }
    .review-card-title { margin:0; color:var(--ink); font-size:14px; font-weight:680; letter-spacing:-.01em; }
    .review-card-subtitle { margin:2px 0 0; color:var(--muted); font-size:12px; }
    .review-status { margin-left:auto; padding:3px 7px; border:1px solid var(--brand-soft); border-radius:99px; color:var(--brand-ink); background:var(--brand-soft); font-size:11px; white-space:nowrap; }
    .review-card-body { display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; padding:14px 16px; }
    .review-field { min-width:0; }
    .review-field.wide { grid-column:1 / -1; }
    .review-label { display:block; margin-bottom:5px; color:var(--muted); font-size:10px; font-weight:720; letter-spacing:.055em; text-transform:uppercase; }
    .skill-card .review-label { margin-bottom:6px; color:var(--ink); font-size:13px; font-weight:760; letter-spacing:0; line-height:1.35; text-transform:none; }
    .skill-card-required { margin-left:3px; color:var(--danger); font-weight:820; }
    .skill-agent-card .skill-card .review-label { font-size:11px; }
    .review-value { color:var(--ink); font-size:12px; line-height:1.55; }
    .review-chips { display:flex; flex-wrap:wrap; gap:5px; }
    .review-chip { max-width:100%; overflow:hidden; padding:3px 7px; border:1px solid var(--line); border-radius:6px; color:var(--ink); background:var(--subtle); font:11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow:ellipsis; white-space:nowrap; }
    .metadata-disclosure { grid-column:1 / -1; padding-top:2px; border-top:1px solid var(--line); }
    .metadata-table-detail { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
    .metadata-table-detail:first-child { margin-top:0; padding-top:0; border-top:0; }
    .metadata-table-name { color:var(--ink); font-size:12px; font-weight:700; }
    .metadata-table-description { margin:2px 0 6px; color:var(--muted); font-size:11px; }
    .review-safety { display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px; border-top:1px solid var(--line); color:var(--muted); background:var(--panel-muted); font-size:11px; }
    .review-safety span { display:inline-flex; align-items:center; gap:4px; }
    .review-safety span::before { width:5px; height:5px; border-radius:50%; background:var(--brand); content:""; }
    .review-card .msg-actions { padding:0 16px 15px; margin-top:0; }

    .btn { padding:7px 12px; border:1px solid #dededb; border-radius:7px; color:#454542; background:#fff; font-size:12px; font-weight:580; line-height:1.55; }
